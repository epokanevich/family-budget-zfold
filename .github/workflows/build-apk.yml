name: Build FamilyBudget APK

run-name: Build APK (${{ inputs.default_user_name || 'Eugene' }} / ${{ inputs.default_family_code || 'POKANE-FAMILY' }})

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      default_family_code:
        description: 'Default familySpaceCode (empty = POKANE-FAMILY)'
        required: false
        default: ''
      default_user_name:
        description: 'Default userName (empty = Евгений)'
        required: false
        default: ''

# APK больше не публикуется в GitHub Releases (в нём зашиты токены синка/Gemini),
# поэтому workflow достаточно только чтения содержимого репозитория.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Verify Room schema export
        run: |
          SCHEMA_DIR=app/schemas
          if [ ! -d "$SCHEMA_DIR" ]; then
            echo "::error::Room schema was not exported to $SCHEMA_DIR (check ksp room.schemaLocation)"
            exit 1
          fi
          CHANGED=$(git status --porcelain --untracked-files=all -- "$SCHEMA_DIR" | awk '{print $2}')
          if [ -z "$CHANGED" ]; then
            echo "Room schema in $SCHEMA_DIR is up to date"
            exit 0
          fi
          echo "::warning::Room schema changed but is not committed: $CHANGED"
          # Сборка идёт только в CI (без локального Android Studio), поэтому отдаём
          # сгенерированную схему через аннотации (base64, частями), чтобы её можно было закоммитить.
          for f in $CHANGED; do
            echo "----- $f -----"
            cat "$f"
            idx=0
            for chunk in $(base64 -w0 "$f" | fold -w 3000); do
              idx=$((idx + 1))
              echo "::notice title=ROOM_SCHEMA ${f} part ${idx}::${chunk}"
            done
          done

      - name: Decode Release Keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.keystore"
            echo "KEYSTORE_PATH=${{ runner.temp }}/release.keystore" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_BASE64 secret not set, falling back to debug signing"
          fi

      - name: Build Release APK (R8 Minified & Optimized for Z Fold 4/5)
        env:
          SYNC_GITHUB_TOKEN: ${{ secrets.SYNC_GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEFAULT_FAMILY_SPACE_CODE: ${{ inputs.default_family_code }}
          DEFAULT_USER_NAME: ${{ inputs.default_user_name }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyBudget-ZFold-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
